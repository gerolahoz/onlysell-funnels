<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Artisan Cappuccino Capsules · Member Area</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#9e5200;--brand-dark:#7c3600;--background:#fdf8ee;--card:#fefaf1;--foreground:#3c220f;--muted:#886b54}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--background);color:var(--foreground);font-family:'Figtree',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:1px solid #f0e2c9;border-radius:20px;padding:40px 32px;max-width:480px;text-align:center;box-shadow:0 12px 30px rgba(124,54,0,.08)}
  .icon{font-size:40px;margin-bottom:12px}
  h1{font-family:'Baloo 2',cursive;font-size:22px;color:var(--brand-dark);margin-bottom:10px}
  p{font-size:15px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">☕📦</div>
    <h1>Artisan Cappuccino Capsules</h1>
    <p>Your member area is being prepared. Your download links will appear here shortly — check back soon, or check your confirmation email.</p>
  </div>
</body>
</html>
