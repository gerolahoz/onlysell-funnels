server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # extension-less URLs: /oto1 → /oto1.html + trailing-slash folder support
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # cache PDFs and assets aggressively
    location ~* \.(pdf|png|jpg|jpeg|webp|svg|css|js|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # security + hide from search
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # allow PDF inline preview
    types {
        application/pdf pdf;
    }

    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # up to 40 MB (the core PDF is 32 MB)
    client_max_body_size 40M;
}
